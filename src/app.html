<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#14263a" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="AoP" />
		<meta name="description" content="Mass and balance and takeoff and landing performance for piston aircraft. Open source, and works offline." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!-- Link previews. The image path is relative because each club's copy has its own address. -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Aero Open Performance" />
		<meta property="og:description" content="Mass and balance and takeoff and landing performance for piston aircraft. Open source, and works offline." />
		<meta property="og:image" content="%sveltekit.assets%/og.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Aero Open Performance: mass and balance and takeoff and landing performance for piston aircraft" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
